name: MarMac Build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Quale client buildare'
        required: true
        default: 'slave'
        type: choice
        options:
          - slave
          - master
          - both

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu

      - name: Install Flutter ${{ env.FLUTTER_BRIDGE_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Get Flutter deps (downgrade extended_text for Flutter 3.22.3)
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter_rust_bridge_codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
          retention-days: 1

  build-slave:
    if: ${{ inputs.variant == 'slave' || inputs.variant == 'both' }}
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Download bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* $engineDir/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi

      - name: Build Rust lib (marmac_slave)
        run: cargo build --locked --release --lib --features flutter,marmac_slave

      - name: Build Flutter (marmac_slave)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release
          cd ..

      - name: Package MarMac-Assistenza as single portable exe
        shell: powershell
        run: |
          # Installa ps2exe per compilare il launcher PowerShell in exe silenzioso
          Install-Module -Name ps2exe -Scope CurrentUser -Force -ErrorAction Stop

          # Compila il launcher in exe (nessuna finestra, nessuna console)
          Invoke-ps2exe `
            -InputFile res\marmac-slave-launcher.ps1 `
            -OutputFile flutter\build\windows\x64\runner\Release\MarMac-Assistenza.exe `
            -NoConsole -NoOutput -IconFile res\icon.ico `
            -Title "MarMac Assistenza" -Version "1.5.3.0"

          # Rinomina rustdesk.exe → rustdesk.exe (invariato), il launcher è il punto di ingresso
          # Crea il SFX autoestraente con 7-Zip
          $buildDir = "flutter\build\windows\x64\runner\Release"
          $sfxModule = "C:\Program Files\7-Zip\7z.sfx"
          $configFile = "res\sfx-slave-config.txt"

          # Aggiorna il config SFX per lanciare il launcher invece del rustdesk diretto
          $sfxConfig = @"
          ;!@Install@!UTF-8!
          Title="MarMac Assistenza"
          BeginPrompt="No"
          RunProgram="MarMac-Assistenza.exe"
          ;!@InstallEnd@!
          "@
          $sfxConfig | Set-Content -Path sfx-config.txt -Encoding UTF8

          # Crea archivio 7z del contenuto build
          & "C:\Program Files\7-Zip\7z.exe" a -t7z build.7z ".\$buildDir\*" -mx=5

          # Concatena: modulo SFX + config + archivio = exe autoestraente
          $sfxBytes   = [System.IO.File]::ReadAllBytes($sfxModule)
          $cfgBytes   = [System.IO.Text.Encoding]::UTF8.GetBytes((Get-Content sfx-config.txt -Raw))
          $archBytes  = [System.IO.File]::ReadAllBytes("build.7z")
          $outStream  = [System.IO.File]::OpenWrite("MarMac-Assistenza-portable.exe")
          $outStream.Write($sfxBytes,  0, $sfxBytes.Length)
          $outStream.Write($cfgBytes,  0, $cfgBytes.Length)
          $outStream.Write($archBytes, 0, $archBytes.Length)
          $outStream.Close()

      - name: Upload MarMac-Assistenza
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Assistenza-windows-x64
          path: MarMac-Assistenza-portable.exe
          retention-days: 90

  build-master:
    if: ${{ inputs.variant == 'master' || inputs.variant == 'both' }}
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Download bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* $engineDir/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi

      - name: Build Rust lib (marmac_master)
        run: cargo build --locked --release --lib --features flutter,marmac_master

      - name: Build Flutter (marmac_master)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release
          cd ..

      - name: Package MarMac-Remote as single portable exe
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force -ErrorAction Stop

          Invoke-ps2exe `
            -InputFile res\marmac-master-launcher.ps1 `
            -OutputFile flutter\build\windows\x64\runner\Release\MarMac-Remote.exe `
            -NoConsole -NoOutput -IconFile res\icon.ico `
            -Title "MarMac Remote" -Version "1.5.3.0"

          $buildDir = "flutter\build\windows\x64\runner\Release"

          $sfxConfig = @"
          ;!@Install@!UTF-8!
          Title="MarMac Remote"
          BeginPrompt="No"
          RunProgram="MarMac-Remote.exe"
          ;!@InstallEnd@!
          "@
          $sfxConfig | Set-Content -Path sfx-config.txt -Encoding UTF8

          & "C:\Program Files\7-Zip\7z.exe" a -t7z build.7z ".\$buildDir\*" -mx=5

          $sfxModule  = "C:\Program Files\7-Zip\7z.sfx"
          $sfxBytes   = [System.IO.File]::ReadAllBytes($sfxModule)
          $cfgBytes   = [System.IO.Text.Encoding]::UTF8.GetBytes((Get-Content sfx-config.txt -Raw))
          $archBytes  = [System.IO.File]::ReadAllBytes("build.7z")
          $outStream  = [System.IO.File]::OpenWrite("MarMac-Remote-portable.exe")
          $outStream.Write($sfxBytes,  0, $sfxBytes.Length)
          $outStream.Write($cfgBytes,  0, $cfgBytes.Length)
          $outStream.Write($archBytes, 0, $archBytes.Length)
          $outStream.Close()

      - name: Upload MarMac-Remote
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Remote-windows-x64
          path: MarMac-Remote-portable.exe
          retention-days: 90
