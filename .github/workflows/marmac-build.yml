name: MarMac Build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Quale client buildare'
        required: true
        default: 'slave'
        type: choice
        options:
          - slave
          - master
          - both

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Get Flutter deps
        run: pushd flutter && flutter pub get && popd

      - name: Run flutter_rust_bridge_codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-files
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
          retention-days: 1

  build-slave:
    if: ${{ inputs.variant == 'slave' || inputs.variant == 'both' }}
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-files
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Setup vcpkg dependencies
        shell: powershell
        run: |
          $vcpkg = "C:\vcpkg\vcpkg.exe"
          & $vcpkg install libyuv:x64-windows-static opus:x64-windows-static libvpx:x64-windows-static aom:x64-windows-static --classic
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust lib (marmac_slave)
        run: cargo build --locked --release --lib --features flutter,marmac_slave

      - name: Build Flutter (marmac_slave)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_SLAVE=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Assistenza
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Assistenza/

      - name: Upload MarMac-Assistenza
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Assistenza-windows-x64
          path: dist/MarMac-Assistenza/
          retention-days: 90

  build-master:
    if: ${{ inputs.variant == 'master' || inputs.variant == 'both' }}
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-files
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Setup vcpkg dependencies
        shell: powershell
        run: |
          $vcpkg = "C:\vcpkg\vcpkg.exe"
          & $vcpkg install libyuv:x64-windows-static opus:x64-windows-static libvpx:x64-windows-static aom:x64-windows-static --classic
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust lib (marmac_master)
        run: cargo build --locked --release --lib --features flutter,marmac_master

      - name: Build Flutter (marmac_master)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_MASTER=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Remote
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Remote/

      - name: Upload MarMac-Remote
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Remote-windows-x64
          path: dist/MarMac-Remote/
          retention-days: 90
