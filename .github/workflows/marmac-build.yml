name: MarMac Build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Quale client buildare'
        required: true
        default: 'slave'
        type: choice
        options:
          - slave
          - master
          - both

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.3"

jobs:
  build-slave:
    if: ${{ inputs.variant == 'slave' || inputs.variant == 'both' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Build Rust lib (marmac_slave)
        run: |
          cargo build --locked --release --lib --features flutter,hwcodec,marmac_slave

      - name: Build Flutter (marmac_slave)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_SLAVE=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Assistenza
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Assistenza/
          cp target/release/deps/dylib_virtual_display.dll dist/MarMac-Assistenza/ 2>/dev/null || true

      - name: Upload MarMac-Assistenza
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Assistenza-windows-x64
          path: dist/MarMac-Assistenza/
          retention-days: 90

  build-master:
    if: ${{ inputs.variant == 'master' || inputs.variant == 'both' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Build Rust lib (marmac_master)
        run: |
          cargo build --locked --release --lib --features flutter,hwcodec,marmac_master

      - name: Build Flutter (marmac_master)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_MASTER=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Remote
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Remote/
          cp target/release/deps/dylib_virtual_display.dll dist/MarMac-Remote/ 2>/dev/null || true

      - name: Upload MarMac-Remote
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Remote-windows-x64
          path: dist/MarMac-Remote/
          retention-days: 90
