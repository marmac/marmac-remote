name: MarMac Build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Quale client buildare'
        required: true
        default: 'slave'
        type: choice
        options:
          - slave
          - master
          - both

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VERSION: "1.5.3"

jobs:
  build-slave:
    if: ${{ inputs.variant == 'slave' || inputs.variant == 'both' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Setup vcpkg and install dependencies
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install libyuv:x64-windows-static opus:x64-windows-static
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust lib (marmac_slave)
        run: cargo build --locked --release --lib --features flutter,marmac_slave

      - name: Build Flutter (marmac_slave)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_SLAVE=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Assistenza
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Assistenza/

      - name: Upload MarMac-Assistenza
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Assistenza-windows-x64
          path: dist/MarMac-Assistenza/
          retention-days: 90

  build-master:
    if: ${{ inputs.variant == 'master' || inputs.variant == 'both' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Install Python dependencies
        run: pip3 install pyinstaller setuptools

      - name: Setup vcpkg and install dependencies
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install libyuv:x64-windows-static opus:x64-windows-static
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust lib (marmac_master)
        run: cargo build --locked --release --lib --features flutter,marmac_master

      - name: Build Flutter (marmac_master)
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release --dart-define=MARMAC_MASTER=true
          cd ..

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist/MarMac-Remote
          cp -r flutter/build/windows/x64/runner/Release/* dist/MarMac-Remote/

      - name: Upload MarMac-Remote
        uses: actions/upload-artifact@v4
        with:
          name: MarMac-Remote-windows-x64
          path: dist/MarMac-Remote/
          retention-days: 90
